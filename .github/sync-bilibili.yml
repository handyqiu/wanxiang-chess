import requests, json, os

MID = os.environ.get("BILI_MID", "123456")

API = "https://api.bilibili.com/x/space/arc/search"

resp = requests.get(
    API,
    params={
        "mid": MID,
        "ps": 12,
        "pn": 1,
        "order": "pubdate",
        "jsonp": "jsonp"
    },
    headers={
        "User-Agent": "Mozilla/5.0",
        "Referer": f"https://space.bilibili.com/{MID}"
    },
    timeout=20
).json()

videos = []

try:
    vlist = resp["data"]["list"]["vlist"]
except Exception:
    vlist = []

for v in vlist:
    videos.append({
        "platform": "bilibili",
        "tag": "教学",
        "source": v.get("author", "B站UP主"),
        "title": v["title"],
        "desc": (v.get("description") or "")[:80],
        "bvid": v["bvid"]
    })

with open("data.json", "r", encoding="utf-8") as f:
    data = json.load(f)

data["videos"] = videos

with open("data.json", "w", encoding="utf-8") as f:
    json.dump(data, f, ensure_ascii=False, indent=2)

print(f"抓到 {len(videos)} 个视频")
